name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Lint JavaScript
        run: pnpm lint:js
        
      - name: Lint CSS
        run: pnpm lint:css
        
      - name: Lint Handlebars
        run: pnpm lint:hbs
        
      - name: Format check
        run: pnpm lint:format
        
      - name: Build application
        run: pnpm build
        
      - name: Run tests
        run: pnpm test
        
  percy-visual-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run Percy visual tests
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: pnpm test:percy
          
      - name: Upload Percy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: percy-results
          path: |
            .percy/
            test-results/